name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      api_base:
        description: Backend base URL baked into the build
        required: false
        default: https://api.noobclaw.com

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04   # has the Android SDK preinstalled (ANDROID_HOME)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Unit tests
        run: set -o pipefail; gradle :app:testDebugUnitTest 2>&1 | tee test.log
      - name: Assemble
        env:
          SCRIPT_PUBKEY: ${{ secrets.SCRIPT_PUBKEY_HEX }}
          API_BASE: ${{ github.event.inputs.api_base || 'https://api.noobclaw.com' }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug -PapiBase="$API_BASE" -PscriptPubKey="$SCRIPT_PUBKEY" 2>&1 | tee build.log
          if [ -n "$SCRIPT_PUBKEY" ]; then
            gradle :app:assembleRelease -PapiBase="$API_BASE" -PscriptPubKey="$SCRIPT_PUBKEY" --stacktrace
          else
            echo "SCRIPT_PUBKEY_HEX secret not set: skipping release build (release refuses to run unsigned scripts)."
          fi
      # Surface the compiler / Gradle errors as annotations (readable without downloading logs).
      - name: Report errors
        if: failure()
        run: |
          for f in test.log build.log; do
            [ -f "$f" ] || continue
            grep -E "^e: |error:|What went wrong|FAILED|Exception|Could not|requires|Dependency|compileSdk|Android Gradle plugin|minCompileSdk|> " "$f" | grep -v "^> Task" | head -60 | while IFS= read -r line; do
              echo "::error::$(echo "$line" | cut -c1-900)"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: noobclaw-mobile-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      # Plain .apk download for testers (no zip): a moving "debug-latest" pre-release, updated on every push to main.
      - name: Publish debug-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk noobclaw-mobile-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest noobclaw-mobile-debug.apk --prerelease --title "Debug build (latest main)" \
            --notes "Debug build of ${GITHUB_SHA}. Test devices only: runs unsigned test scripts."
      # Manual runs on a branch publish their own pre-release ("debug-<branch>") so a branch build can be tried on a phone.
      - name: Publish branch debug build
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="debug-${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/debug/app-debug.apk noobclaw-mobile-debug.apk
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" noobclaw-mobile-debug.apk --prerelease --target "${GITHUB_SHA}" --title "Debug build (${GITHUB_REF_NAME})" \
            --notes "Debug build of ${GITHUB_SHA} from ${GITHUB_REF_NAME}. Test devices only."
